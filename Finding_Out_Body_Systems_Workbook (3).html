<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finding Out: Body Systems Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20262b;
    --paper:#eee3c8;
    --paper-dark:#e2d3ad;
    --bg:#16262a;
    --bg-2:#1d3339;
    --line: rgba(32,38,43,0.16);
    --accent:#1F6F8B;
    --accent-soft: rgba(31,111,139,0.14);
    --good:#3f7d4a;
    --warn:#b4720d;
    --bad:#a53b3b;
    --paper-shadow: 0 18px 40px -20px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #234a4f 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #1a3a3d 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .app{
    max-width:920px;
    margin:0 auto;
  }
  .masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    color:#eef3f2;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .masthead h1{
    font-family:'Bitter', serif;
    font-weight:800;
    font-size:clamp(1.5rem, 4vw, 2.15rem);
    margin:0 0 4px;
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  .masthead p{
    margin:0;
    color:#a9c2bf;
    font-size:0.95rem;
    max-width:46ch;
  }
  .stamp{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    color:#7fb8ae;
    border:1px solid rgba(127,184,174,0.4);
    padding:5px 10px;
    border-radius:3px;
    white-space:nowrap;
    transform:rotate(-1.5deg);
  }

  /* stepper */
  .stepper{
    display:flex;
    gap:6px;
    margin-bottom:18px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .step-btn{
    flex:1 1 0;
    min-width:88px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    color:#8fa6a3;
    font-family:'Work Sans', sans-serif;
    font-size:0.72rem;
    font-weight:600;
    padding:8px 6px;
    border-radius:8px;
    cursor:not-allowed;
    text-align:center;
    line-height:1.25;
    transition:all .15s ease;
  }
  .step-btn .num{
    display:block;
    font-family:'Bitter', serif;
    font-size:0.95rem;
    margin-bottom:2px;
  }
  .step-btn.reachable{cursor:pointer; color:#cfe3e0;}
  .step-btn.reachable:hover{background:rgba(255,255,255,0.1);}
  .step-btn.current{
    background:#eef3f2;
    color:#16262a;
    border-color:#eef3f2;
  }
  .step-btn.done{
    color:#7fb8ae;
    border-color:rgba(127,184,174,0.35);
  }

  /* paper card */
  .card{
    background:var(--paper);
    background-image: linear-gradient(var(--paper), var(--paper));
    border-radius:6px;
    box-shadow:var(--paper-shadow);
    padding:28px 26px 26px;
    position:relative;
    border:1px solid rgba(32,38,43,0.08);
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:22px; right:22px; height:6px;
    background:repeating-linear-gradient(90deg, rgba(32,38,43,0.14) 0 2px, transparent 2px 10px);
    opacity:0.5;
  }
  @media (min-width:640px){
    .card{padding:34px 40px 34px;}
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    color: var(--accent);
    margin:0 0 6px;
  }
  h2.title{
    font-family:'Bitter', serif;
    font-weight:700;
    font-size:clamp(1.35rem, 3.2vw, 1.75rem);
    margin:0 0 10px;
    line-height:1.15;
  }
  .lede{
    font-size:1rem;
    line-height:1.55;
    color:#3c4247;
    max-width:64ch;
    margin:0 0 22px;
  }
  hr.rule{
    border:none;
    border-top:1px dashed var(--line);
    margin:22px 0;
  }

  /* buttons */
  .btn{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    padding:11px 20px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    transition:transform .1s ease, box-shadow .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--ink);
    color:#f3ece0;
  }
  .btn-primary:hover{box-shadow:0 6px 16px -8px rgba(0,0,0,0.5);}
  .btn-primary:disabled{
    background:#b6b0a0; color:#8b8577; cursor:not-allowed; box-shadow:none;
  }
  .btn-ghost{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
  }
  .btn-ghost:hover{background:rgba(32,38,43,0.06);}
  .btn-small{padding:7px 13px; font-size:0.82rem; border-radius:5px;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:26px;
    gap:12px;
    flex-wrap:wrap;
  }

  /* group + role cards */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:12px;
    margin-bottom:20px;
  }
  .pick-card{
    text-align:left;
    background:#f6f0df;
    border:2px solid transparent;
    border-radius:8px;
    padding:14px 15px;
    cursor:pointer;
    transition:all .15s ease;
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
  }
  .pick-card:hover{transform:translateY(-2px); box-shadow:0 10px 20px -14px rgba(0,0,0,0.4);}
  .pick-card.selected{border-color: var(--card-accent, var(--accent)); background:#fbf7ea;}
  .pick-card .dot{
    width:11px; height:11px; border-radius:50%;
    background:var(--card-accent, var(--accent));
    display:inline-block; margin-bottom:8px;
  }
  .pick-card .pname{
    font-family:'Bitter', serif;
    font-weight:700;
    font-size:1.02rem;
    display:block;
    margin-bottom:4px;
  }
  .pick-card .ptag{
    font-size:0.85rem;
    color:#565c60;
    line-height:1.4;
  }

  .callout{
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    padding:12px 15px;
    border-radius:0 6px 6px 0;
    font-size:0.9rem;
    line-height:1.5;
    margin:16px 0;
  }
  .bonus{
    margin-top:18px;
    background:#efe4c3;
    border:1px dashed #a68c4f;
    border-radius:8px;
    padding:14px 16px;
    font-size:0.88rem;
    line-height:1.5;
  }
  .bonus b{font-family:'Bitter', serif;}

  /* learn stage skill blocks */
  .skill-block{
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:14px;
    background:rgba(255,255,255,0.35);
  }
  .skill-block h3{
    font-family:'Bitter', serif;
    font-size:1.08rem;
    margin:0 0 6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .skill-num{
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem;
    background:var(--ink);
    color:#f3ece0;
    width:22px; height:22px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .skill-block p{margin:0 0 10px; font-size:0.92rem; line-height:1.55; color:#3c4247;}
  .quiz{
    background:rgba(32,38,43,0.04);
    border-radius:6px;
    padding:10px 13px;
  }
  .quiz .q{font-size:0.85rem; font-weight:600; margin-bottom:8px;}
  .quiz-opt{
    display:block;
    width:100%;
    text-align:left;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    padding:8px 11px;
    margin-bottom:6px;
    font-size:0.85rem;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
  }
  .quiz-opt:hover{border-color:var(--accent);}
  .quiz-opt.correct{background:#e4f0e5; border-color:var(--good); color:#22492a;}
  .quiz-opt.incorrect{background:#f4e5e5; border-color:var(--bad); color:#5a2222;}
  .quiz-fb{font-size:0.82rem; margin-top:6px; font-weight:600;}
  .quiz-fb.good{color:var(--good);}
  .quiz-fb.bad{color:var(--bad);}

  .paraphrase-compare{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin:10px 0;
  }
  @media (min-width:560px){ .paraphrase-compare{grid-template-columns:1fr 1fr;} }
  .pp-box{
    border-radius:6px;
    padding:11px 13px;
    font-size:0.85rem;
    line-height:1.5;
  }
  .pp-box.no{background:#f4e5e5; border:1px solid #d9b3b3;}
  .pp-box.yes{background:#e4f0e5; border:1px solid #b7d4bb;}
  .pp-label{font-family:'JetBrains Mono', monospace; font-size:0.68rem; display:block; margin-bottom:5px; font-weight:700;}
  .pp-box.no .pp-label{color:var(--bad);}
  .pp-box.yes .pp-label{color:var(--good);}

  /* form elements */
  label.field-label{
    display:block;
    font-size:0.82rem;
    font-weight:600;
    margin-bottom:5px;
    color:#3c4247;
  }
  input[type=text], input[type=number], textarea, select{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:0.92rem;
    padding:9px 11px;
    border-radius:5px;
    border:1.5px solid var(--line);
    background:#fffdf8;
    color:var(--ink);
    resize:vertical;
  }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  select{ cursor:pointer; }
  textarea.flagged{border-color:var(--warn); background:#fbf3e2;}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr; gap:12px;}
  @media (min-width:560px){ .field-row.two{grid-template-columns:1fr 1fr;} .field-row.three{grid-template-columns:1fr 1fr 1fr;} }
  .hint{font-size:0.78rem; color:#6b6155; margin-top:5px; line-height:1.4;}
  .warn-banner{
    background:#fbeccb;
    border:1px solid var(--warn);
    color:#5c3f08;
    border-radius:6px;
    padding:9px 12px;
    font-size:0.82rem;
    margin-top:8px;
    line-height:1.45;
  }
  .check-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:0.82rem;
    margin-top:6px;
  }
  .check-row input{width:auto; margin-top:3px;}

  /* timer */
  .timer-panel{
    background:#16262a;
    color:#eef3f2;
    border-radius:10px;
    padding:22px 20px;
    text-align:center;
    margin-bottom:22px;
  }
  .timer-display{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(2.6rem, 10vw, 3.6rem);
    font-weight:500;
    letter-spacing:0.02em;
    margin:6px 0 12px;
    font-variant-numeric: tabular-nums;
  }
  .timer-display.urgent{color:#e08a6b;}
  .timer-display.done{color:#7fb8ae;}
  .preset-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px;}
  .preset-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:#cfe3e0;
    padding:7px 14px;
    border-radius:20px;
    font-size:0.82rem;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
  }
  .preset-btn.active{background:#eef3f2; color:#16262a; border-color:#eef3f2;}
  /* concept/layout pickers sit on the light paper card, so they need dark-on-light defaults */
  .paper-btn{
    background:#f6f0df;
    border:1.5px solid rgba(32,38,43,0.25);
    color:var(--ink);
    padding:7px 14px;
    border-radius:20px;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    transition:all .15s ease;
  }
  .paper-btn:hover{background:#fbf7ea; border-color:var(--accent);}
  .paper-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .timer-controls{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .timer-controls .btn{padding:9px 18px;}
  .timer-note{font-size:0.78rem; color:#9db9b5; margin-top:12px;}

  /* fact cards */
  .fact-card{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:12px;
    background:rgba(255,255,255,0.4);
  }
  .fact-card .fc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .fc-source{font-size:0.78rem; color:#6b6155; font-family:'JetBrains Mono', monospace;}
  .fc-text{font-size:0.92rem; line-height:1.5; margin-bottom:10px;}
  .status-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px;}
  .status-dot.green{background:var(--good);}
  .status-dot.amber{background:var(--warn);}
  .status-dot.gray{background:#a29c8c;}
  .rel-checks{display:flex; flex-wrap:wrap; gap:12px; font-size:0.78rem;}
  .rel-checks label{display:flex; align-items:center; gap:5px; cursor:pointer;}
  .rel-checks input{width:auto;}
  .fc-remove{
    background:none; border:none; color:#a53b3b; font-size:0.75rem; cursor:pointer; text-decoration:underline; padding:0;
  }
  .progress-bar-outer{
    background:rgba(32,38,43,0.1);
    border-radius:20px;
    height:9px;
    overflow:hidden;
    margin:10px 0 4px;
  }
  .progress-bar-inner{
    height:100%;
    background:var(--accent);
    border-radius:20px;
    transition:width .3s ease;
  }
  .progress-label{font-size:0.78rem; color:#6b6155;}

  /* checklist gate */
  .gate-list{list-style:none; padding:0; margin:0 0 18px;}
  .gate-list li{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    font-size:0.92rem;
  }
  .gate-list li:last-child{border-bottom:none;}
  .gate-list input{width:auto; margin-top:3px; flex-shrink:0;}

  .evidence-bank{
    background:#e9dfc4;
    border:1px solid #c9b98a;
    border-radius:8px;
    padding:14px 16px;
    max-height:260px;
    overflow-y:auto;
    font-size:0.85rem;
    line-height:1.6;
    margin-bottom:8px;
    user-select:none;
  }
  .evidence-bank .eb-item{margin-bottom:10px;}
  .evidence-bank .eb-item b{font-family:'Bitter', serif;}

  .recap-grid{display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:18px;}
  @media (min-width:560px){ .recap-grid{grid-template-columns:1fr 1fr;} }
  .recap-block{background:rgba(255,255,255,0.4); border:1px solid var(--line); border-radius:8px; padding:13px 15px;}
  .recap-block h4{font-family:'Bitter', serif; font-size:0.85rem; margin:0 0 6px; color:#565c60;}
  .recap-block p, .recap-block div{font-size:0.9rem; margin:0; line-height:1.5;}

  .tag-badge{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    padding:3px 8px;
    border-radius:20px;
    background:var(--card-accent, var(--accent));
    color:#fff;
  }

  ::selection{ background: rgba(31,111,139,0.25); }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div>
      <h1>Finding Out: Body Systems Expedition</h1>
      <p>Your field research journal for the "Finding Out" stage of the inquiry.</p>
    </div>
    <div class="stamp" id="mastheadStamp">FILE: UNASSIGNED</div>
  </div>

  <div class="stepper" id="stepper"></div>

  <div class="card" id="stageCard"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
/* ============ DATA ============ */
const GROUPS = [
  { id:'circulatory', name:'Circulatory System', color:'#B03A2E',
    tag:'Pumps blood, oxygen and nutrients through kilometres of vessels.',
    bigQ:'How does the circulatory system keep the whole body supplied with what it needs?' },
  { id:'digestive', name:'Digestive System', color:'#C9800C',
    tag:'Breaks food down into fuel the body can actually use.',
    bigQ:'How does the digestive system turn food into energy for the body?' },
  { id:'respiratory', name:'Respiratory System', color:'#1F6F8B',
    tag:'Brings in oxygen and clears out carbon dioxide, breath by breath.',
    bigQ:'How does the respiratory system get oxygen into the body?' },
  { id:'musculoskeletal', name:'Musculoskeletal System', color:'#8C6A2F',
    tag:'Bones and muscles team up to hold you up and move you around.',
    bigQ:'How do bones and muscles work together to move the body?' },
  { id:'nervous', name:'Nervous System', color:'#6B4E9E',
    tag:'Sends messages at lightning speed to control the whole body.',
    bigQ:'How does the nervous system control and coordinate the body?' }
];

const ROLES = [
  { id:'a', label:'Structure Investigator',
    desc:"Find the main parts of the system and how they're built. Relate the structure back to the job the system does." },
  { id:'b', label:'Function Investigator',
    desc:'Find out what the system actually does — the main processes it uses, and how it gets that job done.' },
  { id:'c', label:'Connections Investigator',
    desc:'Find out how the system works together with other body systems — and whether it depends on them to function.' }
];

const SKILLS = [
  { title:'Question & Plan',
    body:"Real investigators start with a question that actually needs researching — not one you can answer with a single word.",
    quiz:{ q:'Which is the stronger research question?',
      options:['Are bones hard?', "How do bones and muscles work together to let you jump?"],
      correct:1,
      good:"Right — it needs real investigating, not a yes-or-no guess.",
      bad:"Try again — that one can be answered with a single word, so there's nothing left to investigate." } },
  { title:'Locate & Collect',
    body:'Gather information from more than one place — books, diagrams, videos, trustworthy websites. Use primary sources (things you observe or hear directly) as well as secondary sources (books, articles, websites) when you can.',
    quiz:{ q:'You want to know how fast a heart beats. What is a primary source you could use?',
      options:['A textbook paragraph about the heart', 'Actually taking your own pulse and timing it'],
      correct:1,
      good:'Exactly — you collected that data yourself, first-hand.',
      bad:"Not quite — a textbook paragraph is a secondary source. Someone else already collected and wrote it up." } },
  { title:'Evaluate',
    body:'Before you trust a source, check who made it and when. A page with no author and no date is much harder to trust than one from a museum, hospital or textbook.',
    quiz:{ q:'Which source would you trust more for facts about the heart?',
      options:['An anonymous post with no author or date', "A children's science museum page, updated this year"],
      correct:1,
      good:"Good call — you can check who wrote it and when, which makes it easier to trust.",
      bad:"Careful — with no author or date, you can't check who made this claim or how current it is." } },
  { title:'Analyze & Synthesize',
    body:'Sort your facts instead of listing them randomly. Which ones are about structure? Which are about function? Grouping similar facts together makes patterns easier to see.',
    quiz:{ q:'You have ten facts about your system in a messy pile. What should you do before presenting?',
      options:['Present them in the order you found them', 'Group them by theme — structure, function, connections'],
      correct:1,
      good:'Yes — grouped facts tell a clearer story than a random list.',
      bad:"That would be hard for your audience to follow — try grouping related facts together first." } },
  { title:'Communicate & Cite',
    body:"Say where every fact came from. Citing your sources honestly is part of being a principled researcher — and it lets other people check your work.",
    quiz:{ q:"You found a great fact in a book. What should you record alongside it?",
      options:['Nothing — just the fact is enough', 'The title, author or organisation, and date'],
      correct:1,
      good:"Right — that's exactly what lets you (and anyone else) trace the fact back to its source.",
      bad:"Without a source record, nobody — including future you — can check where that fact came from." } },
  { title:'Choose Your Sources', tag:'Decision-making',
    body:"Good researchers weigh up their options instead of grabbing the first thing they see. That means predicting which sources will actually help, and being able to explain the reasons behind your pick.",
    quiz:{ q:"You find two sources about the heart: a well-known children's science museum page updated this year, and a random blog with no author, no date, but brighter pictures. Which should you choose, and why?",
      options:['The blog, because the pictures are more colourful', "The museum page, because you can check who wrote it and when"],
      correct:1,
      good:"Exactly — you weighed up your options and picked the one you can actually trust, not just the one that looks nicest.",
      bad:"Nice pictures don't make a source trustworthy — check who wrote it and when before you decide." } },
  { title:'Decide What to Keep', tag:'Decision-making',
    body:"Once you've gathered plenty of facts, you have to decide which ones actually make the cut. Good decision-makers weigh their options against a clear goal — like their research question — instead of keeping everything just because they found it.",
    quiz:{ q:"You have 12 facts but only room for 6 on your slide. How should you decide which to keep?",
      options:['Keep whichever 6 I typed first', 'Keep the ones that answer my research question most directly'],
      correct:1,
      good:"Right — deciding what to keep is its own decision. Go back to your question and keep what answers it best.",
      bad:"The order you typed them in isn't a reason to keep a fact — check which ones actually answer your question." } }
];

const GATE_ITEMS = [
  "I can teach others about my topic.",
  "I can explain how my facts connect to our unit concepts.",

function group(){ return GROUPS.find(g => g.id === state.group); }
function newImageSlot(){ return { desc:'', source:'', dataUrl:null, fileName:'', natW:0, natH:0, layout:'imageLeft', annotations:[] }; }

/* ============ RENDER ROOT ============ */
function render(){
  renderStepper();
  renderStage();
  const g = group();
  document.getElementById('mastheadStamp').textContent = g
    ? `FILE: ${g.name.toUpperCase()} · ROLE ${state.role ? state.role.toUpperCase() : '?'}`
    : 'FILE: UNASSIGNED';
  document.documentElement.style.setProperty('--accent', g ? g.color : '#1F6F8B');
  document.documentElement.style.setProperty('--accent-soft', g ? hexToSoft(g.color) : 'rgba(31,111,139,0.14)');
}

function hexToSoft(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.14)`;
}

function renderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = STAGES.map((s,i) => {
    let cls = 'step-btn';
    if(i === state.stageIndex) cls += ' current';
    else if(i < state.maxReached) cls += ' done reachable';
    else if(i === state.maxReached) cls += ' reachable';
    return `<button class="${cls}" data-goto="${i}" ${i>state.maxReached?'disabled':''}>
      <span class="num">${i+1}</span>${s.label}
    </button>`;
  }).join('');
  el.querySelectorAll('.step-btn.reachable').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.stageIndex = parseInt(btn.dataset.goto,10);
      render();
    });
  });
}

function goTo(i){
  state.stageIndex = i;
  if(i > state.maxReached) state.maxReached = i;
  window.scrollTo({top:0, behavior:'smooth'});
  render();
}

/* ============ STAGE ROUTER ============ */
function renderStage(){
  const card = document.getElementById('stageCard');
  const id = STAGES[state.stageIndex].id;
  if(id === 'brief') card.innerHTML = briefHTML();
  else if(id === 'learn') card.innerHTML = learnHTML();
  else if(id === 'question') card.innerHTML = questionHTML();
  else if(id === 'investigate') card.innerHTML = investigateHTML();
  else if(id === 'check') card.innerHTML = checkHTML();
  else if(id === 'summarize') card.innerHTML = summarizeHTML();
  else if(id === 'ready') card.innerHTML = readyHTML();
  attachStageEvents(id);
}

];

function fillStem(stem, groupName){
  let used = false;
  return stem.replace(/____/g, () => {
    if(!used){ used = true; return groupName; }
    return '____';
  });
}

function questionHTML(){

  const r = ROLES.find(x=>x.id===state.role);

function questionSlotHTML(i, slot){

  const noSupport = slot.type === 'partner';

      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
        ${concepts.map(c => `<button class="paper-btn ${q.concept===c.name?'active':''}" data-conceptbtn="${i}" data-conceptname="${c.name}">${c.name}</button>`).join('')}
      </div>
      ${q.concept ? `
        <p class="hint" style="margin-bottom:8px;">${concepts.find(c=>c.name===q.concept).hint}</p>
        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
          ${concepts.find(c=>c.name===q.concept).stems.map(stem => `<button class="quiz-opt" data-stembtn="${i}" data-stem="${escapeAttr(stem)}">${fillStem(stem, 'the '+g.name.toLowerCase())}</button>`).join('')}
        </div>` : ''}
      `}

      <div class="field" style="margin-bottom:0;">
        <label class="field-label">My question ${i+1}</label>
        <textarea data-qtext="${i}" rows="2" placeholder="${noSupport ? 'Write your own open-ended question together \u2014 no starters this time.' : 'Write or edit your open-ended question here...'}">${escapeHTML(q.text)}</textarea>
        <div data-qtips="${i}">${tips.length ? `<div class="warn-banner">${tips.join('<br>')}</div>` : (q.text.trim().length>0 ? `<div class="callout">Looks like a solid, open-ended question.</div>` : '')}</div>
      </div>
    </div>
  `;
}

function allQuestionsValid(){
  return state.questions.every((q,i) => {
    const lengthOk = q.text.trim().length >= 10;
    const partnerOk = QUESTION_SLOTS[i].type !== 'partner' || (q.partner && q.partner.trim().length > 0);
    return lengthOk && partnerOk;
  });
}

function questionTips(q){
  const tips = [];
  const trimmed = (q||'').trim();
  if(trimmed.length === 0) return tips;
  const first = trimmed.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'');
  if(['is','are','do','does','can','will','was','were'].includes(first)){
    tips.push("This starts like a yes/no question — try starting with <b>how</b> or <b>why</b> instead.");
  }
  if(trimmed.length < 15){
    tips.push("This looks quite short — add more detail so it's clear exactly what you're investigating.");
  }
  return tips;
}

function searchPrompts(qText, g, role, concept){
  const sys = g ? g.name.toLowerCase() : 'body system';
  const base = [];
  if(concept === 'Form'){
    base.push(`parts of the ${sys} for kids`, `${sys} diagram labelled`);
  } else if(concept === 'Function'){
    base.push(`what does the ${sys} do for kids`, `how the ${sys} works step by step`);
  } else if(concept === 'Connection'){
    base.push(`how the ${sys} works with other body systems`, `${sys} and other systems for kids`);
  } else if(concept === 'Causation'){
    base.push(`why the ${sys} works the way it does`, `what happens if the ${sys} stops working`);
  } else {
    base.push(`${sys} for kids`, `${sys} facts for students`);
  }
  base.push(`${sys} KidsHealth`);
  return base;
}

function factRelevanceLevel(f){
  const n = (f.r1?1:0)+(f.r2?1:0)+(f.r3?1:0);
  if(n===3) return 'green';
  if(n>=1) return 'amber';
  return 'gray';
}

function factCardHTML(f){
  const lvl = factRelevanceLevel(f);
  const reason = SOURCE_REASONS.find(r=>r.value===f.sourceReason);
  return `
    <div class="fact-card" data-fact="${f.id}">
      <div class="fc-top">

          <span class="status-dot ${lvl}"></span>

        <button class="fc-remove" data-remove="${f.id}">remove</button>
      </div>
      <div class="fc-text">${escapeHTML(f.text)}</div>

    </div>
  `;
}

/* Builds the same slide plan the PPTX generator uses, so the preview matches the export. */
function buildSlidePlan(){
  const g = group();
  const r = ROLES.find(x=>x.id===state.role);
  const facts = deckFacts();
  const partnerSlot = state.questions.find((q,i)=>QUESTION_SLOTS[i].type==='partner');
  const slides = [];

  slides.push({ kind:'title', title:g.name, sub:`${r.label} · Finding Out Research`,
    note: partnerSlot && partnerSlot.partner ? `Question 3 with ${partnerSlot.partner}` : '' });

  slides.push({ kind:'questions', title:'My Research Questions',
    items: state.questions.map((q,i)=>({
      text: q.text || '(not written yet)',
      meta: [q.concept, QUESTION_SLOTS[i].type==='partner' && q.partner ? `with ${q.partner}` : ''].filter(Boolean).join(' · ')
    })) });

  const chunkSize = 4;
  state.questions.forEach((q,qi)=>{
    const qFacts = facts.filter(f=>f.questionIdx===qi);
    for(let i=0;i<qFacts.length;i+=chunkSize){
      slides.push({ kind:'facts', title:(q.text||`Question ${qi+1}`)+(i>0?' (continued)':''),
        concept:q.concept||'', items:qFacts.slice(i,i+chunkSize) });
    }
  });
  const orphans = facts.filter(f=>typeof f.questionIdx !== 'number');
  for(let i=0;i<orphans.length;i+=chunkSize){
    slides.push({ kind:'facts', title:'Other Findings', concept:'', items:orphans.slice(i,i+chunkSize) });
  }

  slides.push({ kind:'summary', title:'Summary', body: state.summaryText || '(Write a summary first.)' });

  state.images.forEach(img=>{
    if(img.dataUrl) slides.push({ kind:'image', img });
  });

  slides.push({ kind:'sources', title:'Sources', items: state.facts });
  return slides;
}

/* Warns when a fact set doesn't line up with the role and concepts the student chose. */
function coverageChecks(){
  const out = [];
  const facts = deckFacts();
  const r = ROLES.find(x=>x.id===state.role);
  state.questions.forEach((q,qi)=>{
    const n = facts.filter(f=>f.questionIdx===qi).length;
    if(q.text.trim() && n === 0){
      out.push(`Question ${qi+1} has no facts selected${q.concept?` — nothing covers your <b>${q.concept}</b> concept here`:''}.`);
    }
  });
  const concepts = [...new Set(state.questions.map(q=>q.concept).filter(Boolean))];
  concepts.forEach(c=>{
    const covered = state.questions.some((q,qi)=>q.concept===c && facts.some(f=>f.questionIdx===qi));
    if(!covered) out.push(`No selected facts relate to <b>${c}</b>.`);
  });
  if(facts.length && facts.length < 3){
    out.push(`Only ${facts.length} fact${facts.length===1?'':'s'} selected — as the <b>${r.label}</b> you'll want a bit more to teach from.`);
  }
  if(!state.images.some(im=>im.dataUrl)){
    out.push('No images added — a diagram would help your audience see your system.');
  }
  return out;
}

/* ============ TIMER ============ */
function timerPanelHTML(context, presets){
  const t = state.timer;
  const isThis = t.context === context;
  const remaining = isThis ? t.remaining : (presets[0]*60);
  const mins = String(Math.floor(remaining/60)).padStart(2,'0');
  const secs = String(remaining%60).padStart(2,'0');
  let displayClass = '';
  if(isThis && t.running && remaining <= 30 && remaining > 0) displayClass = 'urgent';
  if(isThis && remaining === 0 && t.total>0) displayClass = 'done';
  return `
    <div class="timer-panel" data-timer-context="${context}">
      <div class="preset-row">
        ${presets.map(p => `<button class="preset-btn ${isThis && t.total === p*60 && !t.running && t.remaining===t.total ? 'active':''}" data-preset="${p}" data-context="${context}">${p} min</button>`).join('')}
      </div>
      <div class="timer-display ${displayClass}">${mins}:${secs}</div>
      <div class="timer-controls">
        <button class="btn btn-primary btn-small" data-timerstart="${context}">${isThis && t.running ? 'Pause' : (isThis && t.remaining < t.total ? 'Resume' : 'Start')}</button>
        <button class="btn btn-ghost btn-small" data-timerreset="${context}">Reset</button>
      </div>
      <div class="timer-note">${isThis && remaining===0 && t.total>0 ? "Time's up! Wrap up and move on when you're ready." : 'Pick a length, then start the clock.'}</div>
    </div>
  `;
}

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
}

function playChime(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [0,0.18,0.36].forEach((offset,i)=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = i===2 ? 880 : 660;
    gain.gain.setValueAtTime(0.0001, now+offset);
    gain.gain.exponentialRampToValueAtTime(0.15, now+offset+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.3);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now+offset);
    osc.stop(now+offset+0.32);
  });
}

function timerTick(){
  const t = state.timer;
  if(t.remaining > 0){
    t.remaining -= 1;
    updateTimerDisplayOnly();
    if(t.remaining === 0){
      t.running = false;
      clearInterval(t.intervalId);
      playChime();
      render();
    }
  }
}

function updateTimerDisplayOnly(){
  // light-weight update without full re-render, to avoid disrupting focus on inputs
  const t = state.timer;
  document.querySelectorAll(`[data-timer-context="${t.context}"] .timer-display`).forEach(el=>{
    const mins = String(Math.floor(t.remaining/60)).padStart(2,'0');
    const secs = String(t.remaining%60).padStart(2,'0');
    el.textContent = `${mins}:${secs}`;
    el.classList.toggle('urgent', t.running && t.remaining<=30 && t.remaining>0);
  });
}

function startTimer(context, minutesIfNew){
  ensureAudio();
  const t = state.timer;
  if(t.context !== context){
    t.context = context;
    t.total = minutesIfNew*60;
    t.remaining = minutesIfNew*60;
  }
  if(t.running){
    t.running = false;
    clearInterval(t.intervalId);
  } else {
    if(t.remaining <= 0) return;
    t.running = true;
    t.intervalId = setInterval(timerTick, 1000);
  }
  render();
}

function resetTimer(context, minutes){
  const t = state.timer;
  clearInterval(t.intervalId);
  t.context = context;
  t.total = minutes*60;
  t.remaining = minutes*60;
  t.running = false;
  render();
}

function escapeHTML(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHTML(str); }

        reader.onload = () => {

          probe.onload = () => {
            state.images[i].dataUrl = dataUrl;
            state.images[i].fileName = file.name;
            state.images[i].natW = probe.naturalWidth || 4;
            state.images[i].natH = probe.naturalHeight || 3;

            state.images[i].fileName = file.name;
            state.images[i].natW = 4;
            state.images[i].natH = 3;

async function handlePdfClick(){
  const btn = document.getElementById('pdfBtn');
  const status = document.getElementById('pdfStatus');
  if(typeof window.jspdf === 'undefined'){
    status.textContent = "Couldn't load the PDF toolkit — check your internet connection and try again.";
    return;
  }
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Building your PDF…';
  status.textContent = '';
  try{
    generatePdfNotes();
    status.textContent = 'Downloaded! Check your downloads folder for the .pdf file.';
  } catch(err){
    console.error(err);
    status.textContent = "Something went wrong building the PDF. Try the plain text backup instead.";
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function generatePdfNotes(){
  const { jsPDF } = window.jspdf;
  const g = group();
  const r = ROLES.find(x=>x.id===state.role);
  const greenFacts = deckFacts();

  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 44;
  const contentW = pageW - margin*2;
  const footerY = pageH - 28;
  const [ar, ag, ab] = hexToRgb(g.color);

  let y = 0;

  function newPage(){
    doc.addPage();
    doc.setFillColor(ar, ag, ab);
    doc.rect(0, 0, pageW, 6, 'F');
    y = 40;
  }

  function ensure(needed){
    if(y + needed > footerY - 10){
      newPage();
    }
  }

  function heading(text){
    ensure(28);
    doc.setFont('helvetica','bold');
    doc.setFontSize(14);
    doc.setTextColor(ar, ag, ab);
    doc.text(text, margin, y);
    y += 10;
    doc.setDrawColor(ar, ag, ab);
    doc.setLineWidth(1);
    doc.line(margin, y, margin+contentW, y);
    y += 18;
    doc.setTextColor(30,30,30);
  }

  function body(text, opts){
    opts = opts || {};
    doc.setFont('helvetica', opts.bold ? 'bold' : (opts.italic ? 'italic' : 'normal'));
    doc.setFontSize(opts.size || 11);
    doc.setTextColor.apply(doc, opts.color || [40,40,40]);
    const lines = doc.splitTextToSize(text, contentW - (opts.indent||0));
    lines.forEach(line=>{
      ensure(16);
      doc.text(line, margin + (opts.indent||0), y);
      y += (opts.size ? opts.size*1.35 : 15);
    });
    y += opts.gapAfter || 4;
  }

  // Title band
  doc.setFillColor(ar, ag, ab);
  doc.rect(0, 0, pageW, 118, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(22);
  doc.setTextColor(255,255,255);
  doc.text('Finding Out — Research Notes', margin, 52);
  doc.setFont('helvetica','normal');
  doc.setFontSize(13);
  doc.text(`${g.name}  ·  ${r.label}`, margin, 76);
  const partnerSlot = state.questions.find((q,i)=>QUESTION_SLOTS[i].type==='partner');
  if(partnerSlot && partnerSlot.partner){
    doc.setFontSize(10);
    doc.text(`Question 3 researched with ${partnerSlot.partner}`, margin, 96);
  }
  doc.setTextColor(30,30,30);
  y = 150;

  // Big question
  body(`Group's big question: ${g.bigQ}`, { italic:true, size:11, gapAfter:14 });

  // Questions
  heading('My Research Questions');
  state.questions.forEach((q,i)=>{
    const suffix = QUESTION_SLOTS[i].type==='partner' && q.partner ? `  (with ${q.partner})` : '';
    body(`${i+1}. ${q.text || '(not written yet)'}${suffix}`, { gapAfter:8 });
  });
  y += 6;

  // Decision-making
  heading('Decision-Making (IB PYP Approaches to Learning)');
  const summaryReason = SUMMARY_REASONS.find(rr=>rr.value===state.summaryDecision.reason);
  body(`How I decided what to include: ${summaryReason && summaryReason.value ? summaryReason.label : '(not chosen yet)'}`, { gapAfter:8 });
  body(`What I might decide differently next time: ${state.summaryDecision.reflection || '(not written)'}`, { gapAfter:8 });
  y += 6;

  // Facts
  heading('What I Found Out');
  if(state.facts.length === 0){
    body('No facts logged yet.', { italic:true, gapAfter:8 });
  }
  state.facts.forEach((f,i)=>{
    const lvl = factRelevanceLevel(f);
    body(`${i+1}. ${f.text}`, { bold:false, gapAfter:2 });
    body(`Source: ${f.title||'untitled'} — ${f.author||'unknown author'}${f.date?', '+f.date:''}`, { italic:true, size:9.5, indent:14, color:[110,110,110], gapAfter:2 });
    const reason = SOURCE_REASONS.find(rr=>rr.value===f.sourceReason);
    if(reason && reason.value){
      body(`Chosen because: ${reason.label}`, { italic:true, size:9.5, indent:14, color:[110,110,110], gapAfter:2 });
    }
    body(`Fully checked: ${lvl==='green' ? 'Yes' : 'Not yet'}`, { size:9.5, indent:14, color:[110,110,110], gapAfter:10 });
  });
  y += 6;

  // Summary
  heading('Summary');
  body(state.summaryText || '(Not written yet.)', { gapAfter:8 });
  y += 6;

  // Images
  const imagesWithData = state.images.filter(im=>im.dataUrl);
  if(imagesWithData.length){
    heading('Images');
    imagesWithData.forEach(img=>{
      const maxW = Math.min(contentW, 300), maxH = 220;
      const dim = computeContainBox(img.natW, img.natH, maxW, maxH);
      ensure(dim.h + 60);
      doc.addImage(img.dataUrl, getImageFormat(img.dataUrl), margin, y, dim.w, dim.h);
      let capY = y;
      const capX = margin + dim.w + 16;
      const capW = contentW - dim.w - 16;
      if(img.desc){
        doc.setFont('helvetica','bold');
        doc.setFontSize(11);
        doc.setTextColor(30,30,30);
        const capLines = doc.splitTextToSize(img.desc, capW);
        capLines.forEach(line=>{ doc.text(line, capX, capY+11); capY += 15; });
      }
      const legend = (img.annotations||[]).filter(a=>a.label && a.label.trim());
      if(legend.length){
        doc.setFont('helvetica','normal');
        doc.setFontSize(9.5);
        doc.setTextColor(90,90,90);
        legend.forEach((a,ai)=>{
          const legLines = doc.splitTextToSize(`${ai+1}. ${a.label}`, capW);
          legLines.forEach(line=>{ capY += 13; doc.text(line, capX, capY); });
        });
      }
      if(img.source){
        doc.setFont('helvetica','italic');
        doc.setFontSize(9);
        doc.setTextColor(130,130,130);
        capY += 14;
        doc.text(`Source: ${img.source}`, capX, capY);
      }
      y += dim.h + 24;
      doc.setTextColor(30,30,30);
    });
  }

  // Sources bibliography
  heading('Sources');
  if(state.facts.length === 0){
    body('No sources logged yet.', { italic:true });
  } else {
    state.facts.forEach(f=>{
      body(`• ${f.title||'Untitled source'} — ${f.author||'unknown author'}${f.date?', '+f.date:''}`, { size:10, gapAfter:4 });
    });
  }

  // Footer page numbers
  const pageCount = doc.internal.getNumberOfPages();
  for(let p=1; p<=pageCount; p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(150,150,150);
    doc.text(`${g.name} · Finding Out research notes`, margin, footerY+14);
    doc.text(`Page ${p} of ${pageCount}`, pageW - margin - 60, footerY+14);
  }

  doc.save(`${g.id}-finding-out-notes.pdf`);
}

function getImageFormat(dataUrl){
  const m = /^data:image\/(png|jpe?g|webp)/i.exec(dataUrl||'');
  if(!m) return 'PNG';
  const t = m[1].toLowerCase();
  if(t.startsWith('jpe')) return 'JPEG';
  if(t === 'webp') return 'PNG'; // jsPDF has no native webp support; PNG fallback keeps addImage from throwing
  return 'PNG';
}

function hexToRgb(hex){
  const h = (hex||'#1F6F8B').replace('#','');
  return [ parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16) ];
}

function downloadNotes(){
  const g = group();
  const r = ROLES.find(x=>x.id===state.role);
  const greenFacts = deckFacts();
  const lines = [];
  lines.push('FINDING OUT — RESEARCH NOTES');
  lines.push('='.repeat(40));
  lines.push(`Expert group: ${g ? g.name : ''}`);
  lines.push(`Role: ${r ? r.label : ''}`);
  lines.push(`Group big question: ${g ? g.bigQ : ''}`);
  lines.push('My research questions:');
  state.questions.forEach((q,i)=>{
    lines.push(`  ${i+1}. ${q.text}${QUESTION_SLOTS[i].type==='partner' && q.partner ? ` (with ${q.partner})` : ''}`);
  });
  lines.push('');
  lines.push('FACTS');
  lines.push('-'.repeat(40));
  state.facts.forEach((f,i)=>{
    lines.push(`${i+1}. ${f.text}`);
    lines.push(`   Source: ${f.title || 'untitled'} — ${f.author || 'unknown author'}${f.date ? ', '+f.date : ''}`);
    lines.push(`   Fully checked: ${factRelevanceLevel(f)==='green' ? 'yes' : 'no'}`);
    const reason = SOURCE_REASONS.find(r=>r.value===f.sourceReason);
    if(reason && reason.value) lines.push(`   Chosen because: ${reason.label}`);
    lines.push('');
  });
  lines.push(`Facts chosen for the deck: ${greenFacts.length} of ${state.facts.length} logged`);
  lines.push('');
  lines.push('DECISION-MAKING (IB PYP Approaches to Learning)');
  lines.push('-'.repeat(40));
  const summaryReason = SUMMARY_REASONS.find(r=>r.value===state.summaryDecision.reason);
  lines.push(`How I decided what to include: ${summaryReason && summaryReason.value ? summaryReason.label : '(not chosen yet)'}`);
  lines.push(`What I might decide differently next time: ${state.summaryDecision.reflection || '(not written)'}`);
  lines.push('');
  lines.push('SUMMARY');
  lines.push('-'.repeat(40));
  lines.push(state.summaryText || '(not written yet)');
  lines.push('');
  lines.push('IMAGES');
  lines.push('-'.repeat(40));
  state.images.forEach((img,i)=>{
    if(img.desc) lines.push(`${i+1}. ${img.desc} — ${img.source || 'no source noted'}`);
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finding-out-notes-${g ? g.id : 'notes'}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============ POWERPOINT GENERATION ============ */
function hex(c){ return (c||'#1F6F8B').replace('#',''); }

async function handlePptxClick(){
  const btn = document.getElementById('pptxBtn');
  const status = document.getElementById('pptxStatus');
  if(typeof PptxGenJS === 'undefined'){
    status.textContent = "Couldn't load the presentation toolkit — check your internet connection and try again.";
    return;
  }
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Building your slides…';
  status.textContent = '';
  try{
    await generatePptx();
    status.textContent = 'Downloaded! Check your downloads folder for the .pptx file.';
  } catch(err){
    console.error(err);
    status.textContent = "Something went wrong building the presentation. Try again, or use the text notes instead.";
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function computeContainBox(natW, natH, maxW, maxH){
  const nw = natW || 4, nh = natH || 3;
  const scale = Math.min(maxW/nw, maxH/nh);
  return { w: nw*scale, h: nh*scale };
}

function drawAnnotationPins(slide, pres, img, boxX, boxY, boxW, boxH, accentHex){
  (img.annotations||[]).forEach((a,ai)=>{
    if(!a.label && a.label !== '') { /* still draw pin even if label blank */ }
    const size = 0.34;
    const cx = boxX + a.x*boxW;
    const cy = boxY + a.y*boxH;
    slide.addShape(pres.ShapeType.ellipse, { x:cx-size/2, y:cy-size/2, w:size, h:size, fill:{color:accentHex}, line:{color:'FFFFFF', width:1.5} });
    slide.addText(String(ai+1), { x:cx-size/2, y:cy-size/2, w:size, h:size, align:'center', valign:'middle', fontSize:12, bold:true, color:'FFFFFF', fontFace:'Calibri' });
  });
}

function annotationLegendItems(img){
  return (img.annotations||[]).filter(a=>a.label && a.label.trim().length>0).map((a,ai)=>({
    text:`${ai+1}. ${a.label}`, options:{ breakLine:true, fontSize:12, color:'555555', paraSpaceAfter:4 }
  }));
}

/* Facts chosen for the deck. A fact counts unless the student explicitly unticked it,
   so the deck is never silently empty just because relevance boxes weren't filled in. */
function deckFacts(){
  return state.facts.filter(f => f.includeInDeck !== false);
}

async function generatePptx(){
  const g = group();
  const r = ROLES.find(x=>x.id===state.role);
  const accent = hex(g.color);
  const greenFacts = deckFacts();
  const partnerSlot = state.questions.find((q,i)=>QUESTION_SLOTS[i].type==='partner');

  const pres = new PptxGenJS();
  pres.defineLayout({ name:'WIDE', width:10, height:5.625 });
  pres.layout = 'WIDE';
  pres.theme = { headFontFace:'Georgia', bodyFontFace:'Calibri' };

  // Title slide
  let title = pres.addSlide();
  title.background = { color: accent };
  title.addText(g.name, { x:0.6, y:1.9, w:8.8, h:1.1, fontSize:40, bold:true, color:'FFFFFF', fontFace:'Georgia' });
  title.addText(`${r.label}  ·  Finding Out Research`, { x:0.6, y:2.95, w:8.8, h:0.6, fontSize:19, color:'FFFFFF' });
  if(partnerSlot && partnerSlot.partner){
    title.addText(`Question 3 researched with ${partnerSlot.partner}`, { x:0.6, y:3.5, w:8.8, h:0.5, fontSize:13, color:'FFFFFF', italic:true });
  }

  // Questions slide (3 bullets — well within the 6x6 rule)
  let qSlide = pres.addSlide();
  qSlide.addText('My Research Questions', { x:0.5, y:0.35, w:9, h:0.7, fontSize:26, bold:true, color:accent, fontFace:'Georgia' });
  const qBullets = state.questions.map((q,i) => ({
    text: (q.text || '(not written yet)') + (QUESTION_SLOTS[i].type==='partner' && q.partner ? `  (with ${q.partner})` : ''),
    options:{ bullet:true, breakLine:true, paraSpaceAfter:16, fontSize:18, color:'333333' }
  }));
  qSlide.addText(qBullets, { x:0.5, y:1.25, w:9, h:3.9 });

  // Fact slides — grouped under the question each fact answers, capped at 4 facts
  // per slide so each fact keeps its source line and still respects the 6x6 rule.
  const chunkSize = 4;
  if(greenFacts.length === 0){
    let s = pres.addSlide();
    s.addText('What I Found Out', { x:0.5, y:0.35, w:9, h:0.7, fontSize:26, bold:true, color:accent, fontFace:'Georgia' });
    s.addText('No facts were selected for the deck. Go back to Build Summary and tick the facts you want to include.', { x:0.5, y:1.5, w:9, h:1, fontSize:16, italic:true, color:'777777' });
  } else {
    state.questions.forEach((q, qi) => {
      const qFacts = greenFacts.filter(f => f.questionIdx === qi);
      if(qFacts.length === 0) return;
      for(let i=0; i<qFacts.length; i+=chunkSize){
        const chunk = qFacts.slice(i, i+chunkSize);
        let s = pres.addSlide();
        const heading = q.text || `Question ${qi+1}`;
        s.addText(heading + (i>0 ? ' (continued)' : ''), { x:0.5, y:0.32, w:9, h:0.85, fontSize:18, bold:true, color:accent, fontFace:'Georgia', valign:'top' });
        if(q.concept){
          s.addText(q.concept, { x:0.5, y:1.12, w:9, h:0.3, fontSize:10, italic:true, color:'808080' });
        }
        const bullets = [];
        chunk.forEach(f=>{
          bullets.push({ text:f.text, options:{ bullet:true, breakLine:true, fontSize:15, color:'333333', paraSpaceAfter:2 } });
          const srcLine = `Source: ${f.title||'Untitled source'}${f.author?', '+f.author:''}${f.date?', '+f.date:''}`;
          bullets.push({ text:srcLine, options:{ breakLine:true, fontSize:10, italic:true, color:'808080', paraSpaceAfter:12, indentLevel:1 } });
        });
        s.addText(bullets, { x:0.5, y:1.5, w:9, h:3.6 });
      }
    });
    // Any facts not tied to a question still get a slide rather than being dropped
    const orphans = greenFacts.filter(f => typeof f.questionIdx !== 'number');
    for(let i=0; i<orphans.length; i+=chunkSize){
      const chunk = orphans.slice(i, i+chunkSize);
      let s = pres.addSlide();
      s.addText('Other Findings', { x:0.5, y:0.35, w:9, h:0.7, fontSize:22, bold:true, color:accent, fontFace:'Georgia' });
      const bullets = [];
      chunk.forEach(f=>{
        bullets.push({ text:f.text, options:{ bullet:true, breakLine:true, fontSize:15, color:'333333', paraSpaceAfter:2 } });
        const srcLine = `Source: ${f.title||'Untitled source'}${f.author?', '+f.author:''}${f.date?', '+f.date:''}`;
        bullets.push({ text:srcLine, options:{ breakLine:true, fontSize:10, italic:true, color:'808080', paraSpaceAfter:12, indentLevel:1 } });
      });
      s.addText(bullets, { x:0.5, y:1.3, w:9, h:3.8 });
    }
  }

  // Summary slide
  let sumSlide = pres.addSlide();
  sumSlide.addText('Summary', { x:0.5, y:0.35, w:9, h:0.7, fontSize:26, bold:true, color:accent, fontFace:'Georgia' });
  sumSlide.addText(state.summaryText || '(Write a summary in the workbook first.)', { x:0.5, y:1.25, w:9, h:3.8, fontSize:18, color:'333333' });

  // Image slides — placed per chosen layout, with numbered point markers
  state.images.forEach((img)=>{
    if(!img.dataUrl) return;
    let s = pres.addSlide();
    const layout = img.layout || 'imageLeft';
    const legend = annotationLegendItems(img);

    if(layout === 'fullWidth'){
      const maxW = 8.8, maxH = 3.05, regionY = 0.9;
      const dim = computeContainBox(img.natW, img.natH, maxW, maxH);
      const boxX = 0.6 + (maxW - dim.w)/2;
      const boxY = regionY + (maxH - dim.h)/2;
      s.addImage({ data: img.dataUrl, x:boxX, y:boxY, w:dim.w, h:dim.h });
      drawAnnotationPins(s, pres, img, boxX, boxY, dim.w, dim.h, accent);
      const capY = regionY + maxH + 0.12;
      if(img.desc) s.addText(img.desc, { x:0.6, y:capY, w:8.8, h:0.4, fontSize:15, bold:true, color:'333333' });
      if(legend.length) s.addText(legend, { x:0.6, y:capY+0.4, w:5.6, h:0.7, fontSize:12, color:'555555' });
      if(img.source) s.addText(`Source: ${img.source}`, { x:6.3, y:capY+0.4, w:3.1, h:0.5, fontSize:10, italic:true, color:'808080' });
    } else {
      const maxW = 5.4, maxH = 3.95, regionY = 0.75;
      const dim = computeContainBox(img.natW, img.natH, maxW, maxH);
      const isLeft = layout === 'imageLeft';
      const boxX = isLeft ? 0.6 : (9.4 - dim.w);
      const boxY = regionY + (maxH - dim.h)/2;
      s.addImage({ data: img.dataUrl, x:boxX, y:boxY, w:dim.w, h:dim.h });
      drawAnnotationPins(s, pres, img, boxX, boxY, dim.w, dim.h, accent);
      const textX = isLeft ? 6.3 : 0.6;
      const textW = 3.1;
      if(img.desc) s.addText(img.desc, { x:textX, y:0.85, w:textW, h:1.2, fontSize:16, bold:true, color:'333333' });
      if(legend.length) s.addText(legend, { x:textX, y:2.2, w:textW, h:1.7, fontSize:12, color:'555555' });
      if(img.source) s.addText(`Source: ${img.source}`, { x:textX, y:4.55, w:textW, h:0.5, fontSize:10, italic:true, color:'808080' });
    }
  });

  // Sources slide
  let srcSlide = pres.addSlide();
  srcSlide.addText('Sources', { x:0.5, y:0.35, w:9, h:0.7, fontSize:26, bold:true, color:accent, fontFace:'Georgia' });
  const srcBullets = state.facts.length
    ? state.facts.map(f => ({ text:`${f.title||'Untitled source'} — ${f.author||'unknown author'}${f.date?', '+f.date:''}`, options:{ bullet:true, breakLine:true, fontSize:14, color:'333333' } }))
    : [{ text:'No sources logged yet.', options:{ fontSize:14, italic:true, color:'777777' } }];
  srcSlide.addText(srcBullets, { x:0.5, y:1.25, w:9, h:3.9 });

  await pres.writeFile({ fileName: `${g.id}-finding-out-presentation.pptx` });
}

/* ============ INIT ============ */
render();
</script>
